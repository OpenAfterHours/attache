name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"  # a stale uv.lock fails CI instead of being re-resolved

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff check .
      - name: Ruff format check
        run: uvx ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (includes the core size budget)
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the built wheel
        run: |
          wheel=$(ls dist/*.whl)
          uvx --isolated --from "$wheel" attache --help
          uvx --isolated --from "$wheel" attache init --home "$RUNNER_TEMP/home" --name CI
          test -f "$RUNNER_TEMP/home/skills/todos/SKILL.md"
          test -f "$RUNNER_TEMP/home/artifacts/home.html"
          uv run --isolated --no-project --with "$wheel" python -c "import attache.app, attache.web"
