name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this, so a tag is gated by exactly the checks main is gated by.
  workflow_call:

permissions:
  contents: read

# A newer push makes an older run's answer irrelevant. Tags are exempt: cancelling a release
# mid-flight is never what anyone wants.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_LOCKED: "1"  # a stale uv.lock fails CI instead of being re-resolved

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # Pinned to the locked version, so a new ruff release can't fail unrelated pull requests.
      - name: Ruff lint
        run: uvx ruff@0.17.1 check .
      - name: Ruff format check
        run: uvx ruff@0.17.1 format --check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (includes the core size budget)
        run: uv run pytest

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - name: Install isolated browser test dependencies
        run: |
          uv sync
          npm install --prefix "$RUNNER_TEMP/attache-browser-tests" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/attache-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise workspace in Chromium
        run: NODE_PATH="$RUNNER_TEMP/attache-browser-tests/node_modules" node --test tests/ui_workspace.cjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the built wheel
        run: |
          wheel=$(ls dist/*.whl)
          uvx --isolated --from "$wheel" attache --help
          uvx --isolated --from "$wheel" attache init --home "$RUNNER_TEMP/home" --name CI
          test -f "$RUNNER_TEMP/home/skills/todos/SKILL.md"
          test -f "$RUNNER_TEMP/home/artifacts/home.html"
          uv run --isolated --no-project --with "$wheel" python -c "import attache.app, attache.web"
