<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attaché</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff9100'/%3E%3C/svg%3E">
<style>
  /* OpenAfterHours brand tokens: a copy of static/oah-tokens.css (tests keep it in sync). */
:root {
  --oah-orange:           #ff9100;
  --oah-orange-bright:    #ffa724;
  --oah-orange-hover:     #e68200;
  --oah-orange-soft:      #ffb74d;
  --oah-owl-body:         #c9442a;
  --oah-owl-eye:          #ffc857;
  --oah-terminal-green:   #3dd68c;

  --oah-slate-900:        #0d0e11;
  --oah-slate-850:        #11141a;
  --oah-slate-800:        #161719;
  --oah-slate-700:        #1f2430;
  --oah-slate-600:        #2a3142;
  --oah-slate-500:        #3b4356;
  --oah-slate-400:        #64748b;
  --oah-slate-300:        #a0a4ab;
  --oah-slate-200:        #cbd0d8;
  --oah-slate-100:        #e2e4e8;
  --oah-slate-050:        #f1f5f9;

  --font-sans:    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                  Roboto, Helvetica, Arial, sans-serif;
  --font-display: "Space Grotesk", "Inter", -apple-system, sans-serif;
  --font-mono:    "JetBrains Mono", "Roboto Mono", "Fira Code",
                  ui-monospace, SFMono-Regular, Menlo, monospace;

  --ease-std: cubic-bezier(0.4, 0, 0.2, 1);
}
  /* The fonts, served by Attaché at /fonts/: a copy of static/fonts.css. */
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap;
  src: url("/fonts/inter-latin-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 500; font-display: swap;
  src: url("/fonts/inter-latin-500-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 600; font-display: swap;
  src: url("/fonts/inter-latin-600-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 700; font-display: swap;
  src: url("/fonts/inter-latin-700-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: swap;
  src: url("/fonts/space-grotesk-latin-wght-normal.woff2") format("woff2-variations"),
       url("/fonts/space-grotesk-latin-wght-normal.woff2") format("woff2");
}
@font-face {
  font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap;
  src: url("/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "JetBrains Mono"; font-style: normal; font-weight: 600; font-display: swap;
  src: url("/fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2");
}
  /* The page's own tokens: dark night sky by default, a clean light scheme on request. */
  :root {
    color-scheme: dark light;
    --bg: var(--oah-slate-900); --surface: var(--oah-slate-850); --bubble: var(--oah-slate-800);
    --text: var(--oah-slate-100); --muted: var(--oah-slate-300);
    --border: rgba(216, 222, 233, 0.12); --mine: rgba(255, 145, 0, 0.12);
    --mine-border: rgba(255, 145, 0, 0.30); --link: var(--oah-orange-soft);
    --accent: var(--oah-orange); --accent-hover: var(--oah-orange-bright);
    --accent-text: var(--oah-slate-900); --danger: #ff8f73; --radius: 8px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: var(--oah-slate-050); --surface: #ffffff; --bubble: var(--oah-slate-100);
      --text: var(--oah-slate-900); --muted: var(--oah-slate-500);
      --border: rgba(13, 14, 17, 0.12); --mine: rgba(255, 145, 0, 0.14);
      --link: #a35400; --accent-hover: var(--oah-orange-hover); --danger: var(--oah-owl-body);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
  body, button, textarea { font: 15px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
  /* The bar stays night-sky in both schemes, as on the other OpenAfterHours sites. */
  header {
    display: flex; align-items: center; gap: 10px; padding: 11px 18px;
    background: var(--oah-slate-900); color: var(--oah-slate-100);
    border-bottom: 1px solid rgba(216, 222, 233, 0.12);
  }
  h1 { margin: 0; font: 700 18px/1 var(--font-display); letter-spacing: -0.02em; color: var(--oah-orange); }
  #bar { border-bottom: 1px solid var(--border); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--oah-slate-400); }
  .dot.live { background: var(--oah-terminal-green); box-shadow: 0 0 8px rgba(61, 214, 140, 0.6); }
  .views { margin-left: auto; display: none; gap: 4px; }
  .views button { color: var(--oah-slate-100); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 420px) 1fr; }
  #chat { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  #chat { border-right: 1px solid var(--border); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: var(--bubble); }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--border); }
  .msg.you { align-self: flex-end; background: var(--mine); border-color: var(--mine-border); }
  .msg.error { color: var(--danger); }
  .msg.typing { color: var(--muted); font-style: italic; background: none; border-color: transparent; }
  /* A running turn: its latest step, Stop, and a dimmed line of the model's thinking. */
  .msg.typing .stop { margin-left: 10px; padding: 1px 10px; font: 600 12px/1.6 var(--font-sans); }
  .thought { margin-top: 2px; font-size: 13px; opacity: 0.75; }
  .footer { align-self: flex-start; margin-top: -6px; font: 12px/1.5 var(--font-mono); color: var(--muted); }
  .msg a { color: var(--link); }
  .msg a:hover { color: var(--accent); }
  .files { margin-top: 4px; font: 12px/1.5 var(--font-mono); color: var(--muted); }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
  .choices button:disabled { opacity: 0.5; cursor: default; }
  .empty { margin: auto; padding: 24px; text-align: center; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  textarea, button { color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); }
  textarea { flex: 1; min-height: 42px; max-height: 160px; resize: vertical; padding: 9px 11px; background: var(--bg); }
  textarea:focus { border-color: var(--accent); }
  button { padding: 7px 14px; cursor: pointer; font-weight: 600; background: transparent; }
  button { transition: background 180ms var(--ease-std), border-color 180ms var(--ease-std); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button[aria-pressed="true"] { color: var(--link); border-color: var(--accent); background: var(--mine); }
  /* The header is night-sky in both schemes, so its buttons keep the dark colours. */
  .views button { border-color: rgba(216, 222, 233, 0.12); }
  .views button[aria-pressed="true"] { color: var(--oah-orange); border-color: var(--oah-orange); }
  :focus-visible { outline: 2px solid var(--oah-orange); outline-offset: 2px; }
  #pages { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; }
  #bar .muted { color: var(--muted); }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .views { display: flex; }
    #chat { border-right: 0; }
    body[data-view="chat"] #pages, body[data-view="pages"] #chat { display: none; }
  }
</style>
</head>
<body data-view="chat">
<header>
  <span class="dot" id="status" title="Connecting"></span>
  <h1>Attaché</h1>
  <nav class="views" aria-label="View">
    <button type="button" data-view="chat" aria-pressed="true">Chat</button>
    <button type="button" data-view="pages" aria-pressed="false">Pages</button>
  </nav>
</header>
<main>
  <section id="chat" aria-label="Chat">
    <div id="log" aria-live="polite">
      <p class="empty" id="hello">Ask Attaché anything. Replies appear here.</p>
    </div>
    <form id="send">
      <textarea id="text" rows="1" placeholder="Message Attaché" aria-label="Message (Enter sends, Shift+Enter for a new line)"></textarea>
      <button class="primary">Send</button>
    </form>
  </section>
  <section id="pages" aria-label="Pages">
    <div id="bar"></div>
    <iframe id="frame" title="Page" sandbox="allow-scripts allow-forms" hidden></iframe>
  </section>
</main>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("text"), frame = $("frame"), bar = $("bar"), hello = $("hello");
  const URLS = /(https?:\/\/[^\s<>"']*[^\s<>"'.,;:!?)\]])/;
  const KEY = "attache-token";
  let TOKEN = null, current = null, wanted = null, pages = [];
  let thinking = null, loading = false, early = [];
  const asks = new Map(); // ask_id -> the bubble of a question still waiting for your answer

  // Links look like http://127.0.0.1:<port>/#t=<token>&page=<name>; either part may be missing.
  // The token is random per run of Attaché: keep it for other tabs, and out of the address bar.
  function fromHash() {
    const params = new URLSearchParams(location.hash.slice(1));
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    return { token: params.get("t"), page: params.get("page") };
  }
  // localStorage may be blocked; then the token lives in this page only.
  const storage = (action) => { try { return action(localStorage); } catch { return null; } };
  const link = fromHash();

  // A #t= token is kept only once the server accepts it, so a junk link from another site can
  // never replace a token that works.
  async function begin() {
    const stored = storage((s) => s.getItem(KEY));
    for (const token of [link.token, stored]) {
      const check = { headers: { "X-Attache-Token": token } };
      const res = token && (await fetch("/api/messages", check).catch(() => null));
      if (!res || !res.ok) continue;
      TOKEN = token;
      if (token !== stored) storage((s) => s.setItem(KEY, token));
      wanted = link.page;
      connect();
      return loadPages();
    }
    locked();
  }

  function locked() {
    storage((s) => TOKEN && s.getItem(KEY) === TOKEN && s.removeItem(KEY)); // only one that failed
    const note = el("p", "empty", "Open Attaché from the link printed in your terminal.");
    document.querySelector("main").replaceChildren(note);
  }

  async function api(method, path, body) {
    const headers = { "X-Attache-Token": TOKEN, "Content-Type": "application/json" };
    const res = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
    if (res.status === 401) locked(); // a token from an earlier run of Attaché
    const text = await res.text();
    if (!res.ok) throw new Error(text.startsWith("{") ? JSON.parse(text).error : text || res.statusText);
    return JSON.parse(text);
  }

  const el = (tag, className = "", textContent = "") =>
    Object.assign(document.createElement(tag), { className, textContent });

  // Message text is untrusted: text nodes and links only, never HTML. Links to a page of this
  // Attaché (/#page=<name>) open it in the Pages panel.
  function writeText(node, text) {
    text.split(URLS).forEach((part, i) => {
      if (i % 2 === 0) return void (part && node.append(part));
      const a = el("a", "", part);
      Object.assign(a, { href: part, target: "_blank", rel: "noopener noreferrer" });
      const url = URL.canParse(part) ? new URL(part) : null;
      const name = url?.origin === location.origin && new URLSearchParams(url.hash.slice(1)).get("page");
      if (name) a.addEventListener("click", (e) => { e.preventDefault(); show(name, true); });
      node.append(a);
    });
  }

  function add(who, text, files, note) {
    hello.remove();
    const msg = el("div", `msg ${who}`);
    writeText(msg, text);
    if (files && files.length) {
      msg.append(el("div", "files", "Files: " + files.map((f) => f.split(/[\\/]/).pop()).join(", ")));
    }
    if (note) msg.append(el("div", "files", note));
    log.append(msg);
    log.scrollTop = log.scrollHeight;
    return msg;
  }

  // A question for you (an approval, say): one button per option. The first answer counts.
  function showAsk({ ask_id, text, options }) {
    if (asks.has(ask_id)) return; // already shown (it came with the chat and as an event)
    const msg = add("bot", text);
    const choices = el("div", "choices");
    // Answering, by a button or by typing an option: the buttons go, and the choice shows.
    async function choose(option) {
      asks.delete(ask_id);
      choices.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      const res = await api("POST", "/api/answer", { ask_id, choice: option }).catch(() => null);
      choices.replaceChildren(el("span", "files", res?.ok ? `You chose: ${option}` : "No longer open."));
    }
    for (const option of options) {
      const button = el("button", "", option);
      Object.assign(button, { type: "button", onclick: () => choose(option) });
      choices.append(button);
    }
    msg.append(choices);
    asks.set(ask_id, { msg, text, options, choose });
  }

  // Typed text answers a question only when exactly one is open and the text names one of its
  // options, or its number: the server's rule. With more open, the buttons say which.
  function typedAnswer(text) {
    if (asks.size !== 1) return null;
    const [ask] = asks.values();
    const said = text.trim().toLowerCase();
    const option = ask.options.find((o, i) => o.toLowerCase() === said || String(i + 1) === said);
    return option ? () => ask.choose(option) : null;
  }

  // While a turn runs, one bubble shows its latest step ("Thinking…" until the first), Stop
  // (or Esc), and the first sentence of the model's latest thinking, dimmed; hover for it all.
  function setThinking(on) {
    if (on && !thinking) {
      thinking = add("typing", "");
      const stop = el("button", "stop", "Stop");
      Object.assign(stop, { type: "button", title: "Stop this turn (Esc)", onclick: stopTurn });
      thinking.step = el("span", "", "Thinking…");
      thinking.thought = el("div", "thought");
      thinking.append(thinking.step, stop, thinking.thought);
    }
    if (!on && thinking) { thinking.remove(); thinking = null; }
  }

  async function stopTurn() {
    const res = await api("POST", "/api/stop").catch((err) => add("error", `Not stopped: ${err.message}`));
    if (res && !res.stopped) setThinking(false); // nothing was running: the bubble was stale
  }
  addEventListener("keydown", (event) => {
    if (event.key === "Escape" && thinking) { event.preventDefault(); stopTurn(); }
  });

  // At most about 100 characters: the first sentence, cut short if need be.
  function summary(text) {
    const first = text.trim().split(/(?<=[.!?])\s/)[0];
    return first.length > 100 ? `${first.slice(0, 99)}…` : first;
  }

  // A local:me turn's progress, from the activity events: started, step, thinking, finished.
  function activity(event) {
    if (event.kind === "finished") return finished(event);
    setThinking(true); // also for a turn begun in the terminal, or before this page loaded
    if (event.kind === "step") thinking.step.textContent = `${event.label}…`;
    if (event.kind === "thinking") {
      thinking.thought.textContent = summary(event.text);
      thinking.thought.title = event.text;
    }
  }

  // After the reply: a footer such as "4.2s · 3.1k tokens · claude", or "stopped · 2.0s".
  function finished({ seconds, tokens, route, stopped }) {
    setThinking(false);
    const time = `${(seconds ?? 0).toFixed(1)}s`;
    const count = tokens >= 1000 ? `${(tokens / 1000).toFixed(1)}k` : tokens;
    const parts = stopped ? ["stopped", time] : [time, tokens != null && `${count} tokens`, route];
    hello.remove();
    log.append(el("div", "footer", parts.filter(Boolean).join(" · ")));
    log.scrollTop = log.scrollHeight;
  }

  // Each time the event stream opens, load the chat, so a reload or reconnect misses nothing.
  // Replies that arrive meanwhile wait, and are dropped if the loaded chat already has them.
  async function loadHistory() {
    loading = true;
    const since = Date.now() / 1000 - 2;
    const chat = await api("GET", "/api/messages").catch(() => null);
    if (chat) {
      const past = chat.messages;
      const wasThinking = Boolean(thinking);
      thinking = null;
      log.replaceChildren(...(past.length || chat.asks.length ? [] : [hello]));
      const mine = (m) => m.role === "user" && m.sender_name !== "Reminder"; // reminders are ours
      // The server's open questions replace the page's: after a reload their buttons come
      // back, and ones answered elsewhere go. Their stored copy is skipped: they show below.
      asks.clear();
      const open = new Set(chat.asks.map((ask) => ask.text));
      for (const m of past) if (!open.has(m.text)) add(mine(m) ? "you" : "bot", m.text);
      if (wasThinking && past.length && mine(past.at(-1))) setThinking(true);
      chat.asks.forEach(showAsk); // open questions stay last
      const fresh = past.filter((m) => m.ts >= since).map((m) => m.text);
      early = early.filter((msg) => msg.ask_id || !fresh.includes(msg.text));
    }
    loading = false;
    early.splice(0).forEach(receive);
  }

  function receive(msg) {
    if (loading) return void early.push(msg);
    if (msg.activity) return activity(msg.activity);
    if (msg.ask_id) return showAsk(msg);
    if (msg.author) { // you typed this in the terminal: same chat, shown here too
      add("you", msg.text || "", msg.files, `from ${msg.origin || "elsewhere"}`);
      return setThinking(true);
    }
    setThinking(false);
    add("bot", msg.text || "", msg.files);
    loadPages(); // the reply may come with a new page
  }

  $("send").addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add("you", text);
    const answer = typedAnswer(text);
    if (answer) return answer(); // an answer, not a request: no turn, so no "Thinking…"
    setThinking(true);
    await api("POST", "/api/chat", { text }).catch((err) => {
      setThinking(false);
      add("error", `Not sent: ${err.message}`);
    });
  });
  input.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
    event.preventDefault();
    $("send").requestSubmit();
  });

  const press = (all, on) => all.forEach((b) => b.setAttribute("aria-pressed", String(on(b))));
  const views = document.querySelectorAll(".views button");
  function setView(name) {
    document.body.dataset.view = name;
    press(views, (b) => b.dataset.view === name);
  }
  views.forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  const highlight = () => press(bar.querySelectorAll("button"), (b) => b.dataset.name === current);

  // Showing a page always (re)loads it, so a page the agent rewrote is fresh when picked. Its
  // address, with the page's own token, comes from the list; until the list has it, it waits.
  function show(name, focus = false) {
    const page = pages.find((p) => p.name === name);
    if (!page) return void (wanted = name);
    frame.src = page.src;
    frame.hidden = false;
    current = name;
    highlight();
    if (focus) setView("pages");
  }

  const label = (name) => name.charAt(0).toUpperCase() + name.slice(1).replaceAll("-", " ");

  async function loadPages() {
    const list = await api("GET", "/api/artifacts").catch(() => null);
    if (!list) return;
    pages = list;
    if (!list.length) {
      bar.replaceChildren(el("span", "muted", "No pages yet. Ask Attaché for a to-do board."));
      return;
    }
    bar.replaceChildren(...list.map(({ name }) => {
      const button = el("button", "", label(name));
      Object.assign(button, { type: "button", onclick: () => show(name) });
      button.dataset.name = name;
      return button;
    }));
    const has = (name) => list.some((p) => p.name === name);
    if (wanted && has(wanted)) show(wanted, true);
    else if (current && has(current)) highlight();
    else show(has("home") ? "home" : list[0].name);
    wanted = null;
  }

  function connect() {
    const events = new EventSource(`/api/events?token=${encodeURIComponent(TOKEN)}`);
    const status = $("status");
    events.onopen = () => { status.className = "dot live"; status.title = "Connected"; loadHistory(); };
    events.onerror = () => {
      status.className = "dot";
      status.title = "Reconnecting…";
      if (events.readyState === EventSource.CLOSED) locked(); // refused: a token from an old run
    };
    events.addEventListener("message", (event) => {
      const msg = JSON.parse(event.data);
      if (msg.chat_key === "local:me") receive(msg);
    });
    events.addEventListener("ask", (event) => receive(JSON.parse(event.data)));
    events.addEventListener("activity", (event) => receive({ activity: JSON.parse(event.data) }));
  }

  addEventListener("hashchange", () => {
    const { page } = fromHash(); // a #page= link followed in this tab
    if (page && TOKEN) show(page, true);
  });
  begin();
</script>
</body>
</html>
