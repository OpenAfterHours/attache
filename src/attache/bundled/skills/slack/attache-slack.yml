# Slack app manifest for Attaché. At https://api.slack.com/apps choose
# Create New App > From a manifest, pick your workspace and paste this file.
# It uses Socket Mode, so the app needs no public URL.
display_information:
  name: Attaché
  description: Your personal assistant, in Slack.
  background_color: "#0d0e11" # OpenAfterHours slate-900
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: attache # only a-z, 0-9, -, _ and . are allowed here
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - channels:history
      - groups:history
      - mpim:history
      - files:read
      - files:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
