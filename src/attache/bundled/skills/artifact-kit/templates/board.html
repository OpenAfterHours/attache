<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page may use only these collections: keep this in step with COLLECTION below. -->
<meta name="attache-collections" content="todos">
<title>Board</title>
<style>
/* Attaché design tokens (artifact-kit/tokens.css). Paste this whole file into a <style>
   element at the top of every artifact: pages cannot load other files. Use only these color
   tokens, so the page follows the viewer's light or dark setting. */
:root {
  color-scheme: light dark;
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #eeece7;
  --text: #1f1e1c;
  --muted: #6d6a64;
  --border: #e0ddd6;
  --accent: #2b5fd9;
  --accent-text: #ffffff;
  --ok: #2e7d32;
  --warn: #9a5b00;
  --danger: #b3261e;
  --radius: 10px;
  --gap: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615;
    --surface: #1f1f1d;
    --surface-2: #2a2a27;
    --text: #ecebe7;
    --muted: #a3a09a;
    --border: #363531;
    --accent: #7aa2ff;
    --accent-text: #0d1630;
    --ok: #81c784;
    --warn: #ffb74d;
    --danger: #ff8a80;
  }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  background: var(--bg); color: var(--text); font: 15px/1.5 var(--font);
}
h1 { margin: 0; font-size: 20px; font-weight: 650; }
h2 {
  margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.page { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.card {
  padding: 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.error { color: var(--danger); }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.board { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.column { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.item {
  display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.item .title { overflow-wrap: anywhere; }
.item.done .title { color: var(--muted); text-decoration: line-through; }
.badge {
  padding: 1px 8px; font-size: 12px; white-space: nowrap; color: var(--muted);
  background: var(--surface-2); border-radius: 999px;
}
.badge.today { color: var(--warn); }
.badge.late { color: var(--danger); }
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea {
  min-width: 0; padding: 6px 10px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
}
input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
button {
  padding: 6px 12px; cursor: pointer; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius);
}
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.quiet { padding: 2px 6px; background: none; border-color: transparent; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 600px) {
  body { padding: 12px; }
  .board { grid-template-columns: 1fr; }
}
/* Board page */
.add input { flex: 1 1 220px; }
.fields { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.moves { display: flex; gap: 2px; }
</style>
</head>
<body>
<main class="page">
  <header class="row">
    <h1 class="grow" id="heading">Board</h1>
    <span class="muted small" id="count"></span>
  </header>

  <form class="card row add" id="add">
    <input name="title" placeholder="Add a card" aria-label="New card" autocomplete="off" required>
    <button class="primary">Add</button>
  </form>

  <p class="error small" id="problem" role="alert" hidden></p>
  <p class="empty card" id="empty" hidden>
    Nothing here yet. Add the first card above, or ask Attaché to add some.
  </p>
  <section class="board" id="board" aria-label="Board"></section>
</main>
<script>
  "use strict";
  // ---- Adapt these lines to the collection this board shows. --------------------------------
  const HEADING = "Board";                      // page heading (also change <title>)
  const COLLECTION = "todos";                   // the db collection (also in the <meta> tag)
  const COLUMN = "status";                      // the field whose value picks a card's column
  const COLUMNS = [["todo", "To do"], ["waiting", "Waiting"], ["done", "Done"]]; // [value, label]
  const TITLE = "title";                        // the field shown as each card's title
  const HIDDEN = ["notes"];                     // fields not to show on cards
  // ---------------------------------------------------------------------------------------------

  const $ = (id) => document.getElementById(id);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = String(text);
    return node;
  }

  function problem(err) {
    $("problem").hidden = !err;
    $("problem").textContent = err ? `Something went wrong: ${err.message || err}` : "";
  }

  async function move(doc, value) {
    const { id, _updated, _by, ...data } = doc; // the store sets these itself
    try {
      await attache.db.put(COLLECTION, id, { ...data, [COLUMN]: value });
      problem(null);
    } catch (err) {
      problem(err);
    }
  }

  function card(doc, index) {
    const item = el("div", "item");
    const body = el("div", "grow");
    body.append(el("div", "title", doc[TITLE] || "(untitled)"));
    const fields = el("div", "fields small muted");
    for (const [key, value] of Object.entries(doc)) {
      if (key === "id" || key.startsWith("_") || [TITLE, COLUMN, ...HIDDEN].includes(key)) continue;
      if (value == null || value === "") continue;
      fields.append(el("span", "", `${key}: ${typeof value === "object" ? JSON.stringify(value) : value}`));
    }
    body.append(fields);
    const moves = el("div", "moves");
    for (const [step, label, symbol] of [[-1, "Move left", "←"], [1, "Move right", "→"]]) {
      const target = COLUMNS[index + step];
      if (!target) continue;
      const button = el("button", "quiet", symbol);
      Object.assign(button, { type: "button", title: `${label}: ${target[1]}` });
      button.setAttribute("aria-label", `${label} to ${target[1]}`);
      button.addEventListener("click", () => move(doc, target[0]));
      moves.append(button);
    }
    item.append(body, moves);
    return item;
  }

  async function render() {
    let docs;
    try {
      docs = await attache.db.list(COLLECTION);
    } catch (err) {
      return problem(err);
    }
    problem(null);
    $("empty").hidden = docs.length > 0;
    $("board").hidden = docs.length === 0;
    $("count").textContent = docs.length ? `${docs.length} cards` : "";
    const columnOf = (doc) => Math.max(0, COLUMNS.findIndex(([value]) => value === doc[COLUMN]));
    $("board").replaceChildren(...COLUMNS.map(([, label], index) => {
      const cards = docs.filter((doc) => columnOf(doc) === index);
      const column = el("div", "column");
      column.append(el("h2", "", `${label} · ${cards.length}`));
      for (const doc of cards) column.append(card(doc, index));
      return column;
    }));
  }

  $("add").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = event.target.elements.namedItem("title");
    const title = input.value.trim();
    if (!title) return;
    try {
      await attache.db.put(COLLECTION, null, { [TITLE]: title, [COLUMN]: COLUMNS[0][0] });
      input.value = "";
      input.focus();
      problem(null);
    } catch (err) {
      problem(err);
    }
  });

  $("heading").textContent = HEADING;
  if (window.attache) {
    attache.on(COLLECTION, render); // live: re-render whenever a doc in the collection changes
    render();
  } else {
    problem(new Error("open this page from Attaché, which provides its data"));
  }
</script>
</body>
</html>
