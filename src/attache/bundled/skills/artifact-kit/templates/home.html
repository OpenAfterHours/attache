<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="attache-collections" content="todos,_tasks">
<title>Home</title>
<style>
/* Attaché page kit: design tokens and base styles (artifact-kit/tokens.css), in the
   OpenAfterHours look: night-sky slate, orange accents, terminal green for good states,
   Inter, Space Grotesk headings, JetBrains Mono. Paste this whole file into a <style> element
   at the top of every artifact: pages cannot load other files. Use only the kit tokens below
   (--bg, --text, --accent ...), so a page is dark by default and light where the viewer
   prefers it. */

/* OpenAfterHours brand tokens: a copy of Attaché's static/oah-tokens.css. */
:root {
  --oah-orange:           #ff9100;
  --oah-orange-bright:    #ffa724;
  --oah-orange-hover:     #e68200;
  --oah-orange-soft:      #ffb74d;
  --oah-owl-body:         #c9442a;
  --oah-owl-eye:          #ffc857;
  --oah-terminal-green:   #3dd68c;

  --oah-slate-900:        #0d0e11;
  --oah-slate-850:        #11141a;
  --oah-slate-800:        #161719;
  --oah-slate-700:        #1f2430;
  --oah-slate-600:        #2a3142;
  --oah-slate-500:        #3b4356;
  --oah-slate-400:        #64748b;
  --oah-slate-300:        #a0a4ab;
  --oah-slate-200:        #cbd0d8;
  --oah-slate-100:        #e2e4e8;
  --oah-slate-050:        #f1f5f9;

  --font-sans:    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                  Roboto, Helvetica, Arial, sans-serif;
  --font-display: "Space Grotesk", "Inter", -apple-system, sans-serif;
  --font-mono:    "JetBrains Mono", "Roboto Mono", "Fira Code",
                  ui-monospace, SFMono-Regular, Menlo, monospace;

  --ease-std: cubic-bezier(0.4, 0, 0.2, 1);
}

/* The fonts, which Attaché serves at /fonts/: a copy of its static/fonts.css rules. */
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap;
  src: url("/fonts/inter-latin-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 500; font-display: swap;
  src: url("/fonts/inter-latin-500-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 600; font-display: swap;
  src: url("/fonts/inter-latin-600-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 700; font-display: swap;
  src: url("/fonts/inter-latin-700-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: swap;
  src: url("/fonts/space-grotesk-latin-wght-normal.woff2") format("woff2-variations"),
       url("/fonts/space-grotesk-latin-wght-normal.woff2") format("woff2");
}
@font-face {
  font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap;
  src: url("/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "JetBrains Mono"; font-style: normal; font-weight: 600; font-display: swap;
  src: url("/fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2");
}

/* The kit's tokens. Dark is the default; a few light values are darkened (not brand colours)
   so text stays readable: --link, --ok and --warn on white. */
:root {
  color-scheme: dark light;
  --bg: var(--oah-slate-900);
  --surface: var(--oah-slate-850);
  --surface-2: var(--oah-slate-800);
  --raised: var(--oah-slate-700);
  --text: var(--oah-slate-100);
  --heading: #ffffff;
  --muted: var(--oah-slate-300);
  --border: rgba(216, 222, 233, 0.12);
  --accent: var(--oah-orange);
  --accent-hover: var(--oah-orange-bright);
  --accent-text: var(--oah-slate-900);
  --accent-tint: rgba(255, 145, 0, 0.12);
  --link: var(--oah-orange-soft);
  --ok: var(--oah-terminal-green);
  --warn: var(--oah-orange-soft);
  --danger: #ff8f73;
  --radius: 8px;
  --radius-lg: 12px;
  --gap: 12px;
  --font: var(--font-sans);
  --display: var(--font-display);
  --mono: var(--font-mono);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: var(--oah-slate-050);
    --surface: #ffffff;
    --surface-2: var(--oah-slate-050);
    --raised: var(--oah-slate-100);
    --text: var(--oah-slate-900);
    --heading: var(--oah-slate-900);
    --muted: var(--oah-slate-500);
    --border: rgba(13, 14, 17, 0.12);
    --accent-hover: var(--oah-orange-hover);
    --accent-tint: rgba(255, 145, 0, 0.14);
    --link: #a35400;
    --ok: #1d8350;
    --warn: #a35400;
    --danger: var(--oah-owl-body);
  }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  background: var(--bg); color: var(--text); font: 15px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}
h1 { margin: 0; font: 700 22px/1.25 var(--display); letter-spacing: -0.02em; color: var(--heading); }
h2 {
  margin: 0 0 8px; font: 600 11px/1.4 var(--mono); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}
a { color: var(--link); }
code, pre { font-family: var(--mono); }
.page { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.card {
  padding: 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.error { color: var(--danger); }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.board { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.column { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.item {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 11px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  transition: border-color 180ms var(--ease-std);
}
.item:hover { border-color: var(--accent); }
.item .title { overflow-wrap: anywhere; }
.item.done .title { color: var(--muted); text-decoration: line-through; }
.badge {
  padding: 1px 8px; font: 11px/1.6 var(--mono); white-space: nowrap; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
}
.badge.today { color: var(--warn); border-color: var(--warn); }
.badge.late { color: var(--danger); border-color: var(--danger); }
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea {
  min-width: 0; padding: 7px 11px; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius);
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
button {
  padding: 7px 14px; cursor: pointer; font-weight: 600; background: transparent;
  border: 1px solid var(--border); border-radius: var(--radius);
  transition: background 180ms var(--ease-std), border-color 180ms var(--ease-std);
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
button.quiet { padding: 2px 6px; font-weight: 500; border-color: transparent; color: var(--muted); }
button.quiet:hover { color: var(--accent); background: var(--accent-tint); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 600px) {
  body { padding: 12px; }
  .board { grid-template-columns: 1fr; }
}
/* Home page */
.add input[name="title"] { flex: 2 1 200px; }
.add input[name="list"] { flex: 1 1 110px; }
.reminders { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<main class="page">
  <header class="row">
    <h1 class="grow">Today</h1>
    <span class="muted small" id="today"></span>
  </header>

  <form class="card row add" id="add">
    <input name="title" placeholder="Add a to-do" aria-label="New to-do" autocomplete="off" required>
    <input name="list" placeholder="List (Inbox)" aria-label="List" list="lists" autocomplete="off">
    <input name="due" type="date" aria-label="Due date">
    <button class="primary">Add</button>
    <datalist id="lists"></datalist>
  </form>

  <p class="error small" id="problem" role="alert" hidden></p>
  <p class="empty card" id="empty" hidden>
    No to-dos yet. Add your first one above, or tell Attaché
    “add book the dentist to my list”.
  </p>
  <section class="board" id="board" aria-label="To-dos"></section>

  <section class="card" aria-labelledby="reminders-title">
    <h2 id="reminders-title">Upcoming reminders</h2>
    <ul class="reminders" id="reminders"></ul>
  </section>
</main>
<script>
  "use strict";
  // Home: today's to-dos by status, and upcoming reminders. Data comes from window.attache,
  // which Attaché injects; all text goes in with textContent.
  const COLUMNS = [["todo", "To do"], ["waiting", "Waiting"], ["done", "Done today"]];
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const localDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = String(text);
    return node;
  }

  function problem(err) {
    $("problem").hidden = !err;
    $("problem").textContent = err ? `Something went wrong: ${err.message || err}` : "";
  }

  async function save(todo, status) {
    const { id, _updated, _by, ...data } = todo; // the store sets these itself
    try {
      await attache.db.put("todos", id, { ...data, status });
      problem(null);
    } catch (err) {
      problem(err);
    }
  }

  function card(todo, today) {
    const done = todo.status === "done";
    const item = el("div", done ? "item done" : "item");
    const box = el("input");
    box.type = "checkbox";
    box.checked = done;
    box.setAttribute("aria-label", `Done: ${todo.title || "untitled"}`);
    box.addEventListener("change", () => save(todo, box.checked ? "done" : "todo"));

    const body = el("div", "grow");
    body.append(el("div", "title", todo.title || "(untitled)"));
    const meta = el("div", "row small");
    if (todo.list) meta.append(el("span", "badge", todo.list));
    if (todo.due) {
      const day = String(todo.due).slice(0, 10);
      const late = !done && day < today;
      const kind = late ? "badge late" : day === today ? "badge today" : "badge";
      meta.append(el("span", kind, day === today ? "today" : late ? `overdue ${day}` : day));
    }
    if (todo.notes) meta.append(el("span", "muted", todo.notes));
    body.append(meta);
    item.append(box, body);

    if (!done) {
      const waiting = todo.status === "waiting";
      const toggle = el("button", "quiet small", waiting ? "Resume" : "Wait");
      toggle.type = "button";
      toggle.title = waiting ? "Move back to To do" : "Waiting on someone";
      toggle.addEventListener("click", () => save(todo, waiting ? "todo" : "waiting"));
      item.append(toggle);
    }
    return item;
  }

  async function renderTodos() {
    let todos;
    try {
      todos = await attache.db.list("todos");
    } catch (err) {
      return problem(err);
    }
    problem(null);
    const now = new Date();
    const today = localDate(now);
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
    const shown = todos.filter((t) => t.status !== "done" || (t._updated || 0) >= midnight);
    shown.sort((a, b) =>
      String(a.due || "9999").localeCompare(String(b.due || "9999")) ||
      String(a.title || "").localeCompare(String(b.title || "")));

    $("empty").hidden = todos.length > 0;
    $("board").hidden = todos.length === 0;
    const columns = COLUMNS.map(([status, label]) => {
      const items = shown.filter((t) => (COLUMNS.some(([s]) => s === t.status) ? t.status : "todo") === status);
      const column = el("div", "column");
      column.append(el("h2", "", `${label} · ${items.length}`));
      if (!items.length) column.append(el("p", "muted small", status === "todo" ? "All clear." : "Nothing here."));
      for (const todo of items) column.append(card(todo, today));
      return column;
    });
    $("board").replaceChildren(...columns);

    const lists = [...new Set(todos.map((t) => t.list).filter(Boolean))].sort();
    $("lists").replaceChildren(...lists.map((name) => Object.assign(el("option"), { value: name })));
  }

  function when(epoch) {
    const d = new Date(epoch * 1000);
    const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const days = Math.round((new Date(localDate(d)) - new Date(localDate(new Date()))) / 86400000);
    if (days === 0) return `Today ${time}`;
    if (days === 1) return `Tomorrow ${time}`;
    if (days > 1 && days < 7) return `${d.toLocaleDateString([], { weekday: "long" })} ${time}`;
    return `${d.toLocaleDateString([], { day: "numeric", month: "short" })} ${time}`;
  }

  async function renderReminders() {
    let tasks;
    try {
      tasks = await attache.db.list("_tasks");
    } catch (err) {
      return problem(err);
    }
    const rows = tasks.slice(0, 8).map((task) => {
      const row = el("li", "row");
      row.append(el("span", "badge", when(task.due)), el("span", "grow", task.text));
      if (task.cron) row.append(el("span", "muted small", "repeats"));
      return row;
    });
    if (!rows.length) rows.push(el("li", "muted small", "No reminders. Try “remind me at 5pm to call Sam”."));
    $("reminders").replaceChildren(...rows);
  }

  $("add").addEventListener("submit", async (event) => {
    event.preventDefault();
    const fields = event.target.elements;
    const title = fields.namedItem("title").value.trim();
    if (!title) return;
    const todo = { title, list: fields.namedItem("list").value.trim() || "Inbox", status: "todo" };
    if (fields.namedItem("due").value) todo.due = fields.namedItem("due").value;
    try {
      await attache.db.put("todos", null, todo);
      fields.namedItem("title").value = "";
      fields.namedItem("due").value = "";
      fields.namedItem("title").focus();
      problem(null);
    } catch (err) {
      problem(err);
    }
  });

  $("today").textContent = new Date().toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  if (window.attache) {
    attache.on("todos", renderTodos); // live: re-render whenever a to-do changes
    renderTodos();
    renderReminders();
    setInterval(renderReminders, 60000); // reminders have no live feed; refresh each minute
  } else {
    problem(new Error("open this page from Attaché, which provides its data"));
  }
</script>
</body>
</html>
